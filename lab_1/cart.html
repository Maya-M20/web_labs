<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Cart</h1>

        <a href="index.html" class="shop-button">Back to shop</a>
    </header>

    <main>

        <section class="cart">
            <div class="product-in-cart">
                <div class="column">
                    <img src="images/citadels.jpg" alt="Citadels pic" width="100">
                    <h3>Citadels</h3>
                    <button>+</button>
                    <button>-</button>
                </div>

                <div class="column">
                    <p>$20</p>
                    <button>Remove</button>
                </div>
            </div>

        </section>

    </main>

</body>

</html>
