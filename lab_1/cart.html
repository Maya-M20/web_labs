<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Cart</h1>

        <a href="index.html" class="shop-button">Back to shop</a>
    </header>

    <main>

        <section class="cart">

            <div class="products-in-cart"></div>

            <p class="cart-total"></p>
        </section>

        <form>

            <label>
                Name
                <input type="text" required placeholder="Enter your name">
            </label>

            <br>
            <br>

            <label>
                Sername
                <input type="text" required placeholder="Enter your surname">
            </label>

            <br>
            <br>

            <label>
                Adress
                <input type="text" required placeholder="Enter your address">
            </label>

            <br>
            <br>

            <label>
                Email
                <input type="email" required placeholder="Enter your email">
            </label>

            <br>
            <br>

            <button type="submit">
                Create an order
            </button>

        </form>
    </main>

    <footer>
        <p>&copy;2026 Board Game Shop, LLC. All rights reserved.</p>
    </footer>

</body>
<script src="js/cart.js" defer></script>
</html>
