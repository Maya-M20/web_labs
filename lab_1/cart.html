<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.png" type="image/png">
    <title>Cart</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Cart</h1>
        <div class="cart-header"></div>
            <a href="index.html" class="shop-button">Back to shop</a>
        </div>
    
    </header>

    <main>

        <section class="cart">

            <div class="products-in-cart"></div>

            <p class="cart-total"></p>
        </section>

        <button class="checkout">Checkout</button>
        <dialog class="modal-form">
            <form class="order-form">

            <label>
                Name
                <input type="text" required placeholder="Enter your name">
            </label>

            <br>
            <br>

            <label>
                Sername
                <input type="text" required placeholder="Enter your surname">
            </label>

            <br>
            <br>

            <label>
                Adress
                <input type="text" required placeholder="Enter your address">
            </label>

            <br>
            <br>

            <label>
                Phone
                <input type="tel" required placeholder="Enter your phone number">
            </label>

            <br>
            <br>

            <button type="submit">Create an order</button>
        </form>
        </dialog>

        <dialog class="modal-success">
            <p class="modal-text">Order placed successfully</p>
            <button id="closeModal" class="close">OK</button>
        </dialog>
    </main>

    <footer>
        <p style="text-indent: 30px;">&copy;2026 The Gaming Shelf, LLC. All rights reserved.</p>
    </footer>

</body>
<script src="js/cart.js" defer></script>
</html>
